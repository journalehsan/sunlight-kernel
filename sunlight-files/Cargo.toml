[package]
name = "sunlight-files"
version = "0.2.5241-alpha.2"





















































































































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "sunlight-files"
path = "src/main.rs"
required-features = ["native-svg"]

[dependencies]
anyhow = { version = "1", default-features = false }
sunlight-docserv = { path = "../sunlight-docserv", default-features = false }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m", "file-ops"] }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }

[features]
native-svg = ["sunlight-ui/svg", "sunlight-libc/native-std"]
document-thumbnail-smoke = []
