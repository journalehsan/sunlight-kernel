[package]
name = "wiseowl-memory"
version = "0.2.2839-alpha.1"
edition = "2021"
description = "Wise Owl Phase 0/1: cognitive memory contracts and bounded short-term memory service"
license = "MIT OR Apache-2.0"

[lib]
name = "wiseowl_memory"
path = "src/lib.rs"

[[bin]]
name = "wiseowl-memoryd"
path = "src/bin/wiseowl-memoryd.rs"
required-features = ["host"]

[[bin]]
name = "wiseowl-memoryctl"
path = "src/bin/wiseowl-memoryctl.rs"
required-features = ["host"]

[features]
default = ["host"]
# Host / development: std, filesystem spill, Unix socket daemon, full tests.
host = ["dep:serde", "dep:bincode", "dep:thiserror", "dep:log", "dep:lz4_flex"]
# Reserved for future no_std SunlightOS daemon wiring (same contracts/engine).
sunlightos = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
thiserror = { version = "1", optional = true }
log = { version = "0.4", optional = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile = "3"
