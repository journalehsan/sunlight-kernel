[package]
name = "wiseowl-memory"
version = "0.2.3592-alpha.1"

























edition = "2021"
description = "Wise Owl Phase 0/1/1.1: cognitive memory contracts and bounded short-term memory service"
license = "MIT OR Apache-2.0"

[lib]
name = "wiseowl_memory"
path = "src/lib.rs"

[[bin]]
name = "wiseowl-memoryd"
path = "src/bin/wiseowl-memoryd.rs"

[[bin]]
name = "wiseowl-memoryctl"
path = "src/bin/wiseowl-memoryctl.rs"

[features]
default = ["host"]
# Host / development: std, filesystem spill, Unix socket daemon, full tests.
host = ["dep:serde", "dep:bincode", "dep:thiserror", "dep:log", "dep:lz4_flex"]
# Native SunlightOS daemon + CLI (no_std + alloc + sunlight-ipc).
sunlightos = ["dep:sunlight-ipc", "dep:sunlight-libc", "dep:lz4_flex", "dep:heapless"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
thiserror = { version = "1", optional = true }
log = { version = "0.4", optional = true }
# std feature of lz4_flex is fine on host; on no_std sunlightos we still enable it
# for block API (uses alloc). If that fails, drop std feature for sunlightos-only builds.
lz4_flex = { version = "0.11", default-features = false, optional = true }
sunlight-ipc = { path = "../ipc", optional = true }
sunlight-libc = { path = "../sunlight-libc", optional = true, features = ["global-alloc", "dynamic-heap"] }
heapless = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
