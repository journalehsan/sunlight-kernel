[package]
name        = "sunlight-ui"
version     = "0.2.2557-alpha.1"


















edition     = "2021"
description = "SunlightOS framebuffer widget toolkit"
license     = "MIT"

[dependencies]
# Optional: enables the app module (event-loop wrapper over SGP protocol).
sunlight-ipc = { path = "../ipc", optional = true }
# SIMG v2 + shared image decode (no_std + alloc).
sun-img = { path = "../sun-img", default-features = false }

[features]
default = []
# Enable std (for tests / host tooling). Kernel builds use no_std + alloc.
std = ["sun-img/std"]
# Application framework: App trait + Window struct + event-loop runner.
# Requires sunlight-ipc (display server SGP protocol).
app = ["dep:sunlight-ipc"]

[lib]
name = "sunlight_ui"
path = "lib.rs"
