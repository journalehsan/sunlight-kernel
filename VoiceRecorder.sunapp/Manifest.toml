[bundle]
format = 1

[application]
id = "org.sunlight.voice-recorder"
name = "Sunlight Voice Recorder"
version = "0.1.0"
kind = "windowed"
icon = "Resources/icon.tga"

[runtime]
type = "native"

[entry]
executable = "/bin/voice-recorder"

[session]
startup_eligible = false
default_enabled = true
single_instance = true
launch_path = "/bin/voice-recorder"
