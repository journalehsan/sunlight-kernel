[package]
name = "sun-font"
version = "0.2.1799"
































































































































































































edition = "2021"
description = "SunlightOS build-time rasterized Inter/MiniType font abstraction"
license = "MIT"

[dependencies]
sunlight-ui = { path = "../sunlight-ui" }

[build-dependencies]
fontdue = "0.7"
rustybuzz = "0.10"
serde_json = "1"

[features]
default = []
# Expose std-based helpers (e.g. for the minitype-demo binary)
std = []

[lib]
name = "sun_font"
path = "src/lib.rs"

[[bin]]
name = "minitype-demo"
path = "src/bin/demo.rs"
required-features = ["std"]
