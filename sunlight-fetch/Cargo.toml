[package]
name = "sunlight-fetch"
version = "0.2.831"
























































































































































































































edition = "2021"
authors = ["SunlightOS Contributors"]
description = "Lightweight chunked HTTP downloader for SunlightOS"

[[bin]]
name = "fetch"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["host-linux"]
host-linux = ["dep:rustls", "dep:webpki-roots", "rustls/std", "dep:log"]
sunlightos = [
    "dep:sunlight-libc",
    "dep:sunlight-ipc",
    "dep:sunlight-net",
]

[dependencies]
sunlight-libc = { path = "../sunlight-libc", optional = true }
sunlight-ipc = { path = "../ipc", optional = true }
sunlight-net = { path = "../sunlight-net", optional = true }
rustls = { version = "0.23", default-features = false, features = ["tls12", "ring", "logging"], optional = true }
webpki-roots = { version = "0.26", optional = true }
log = { version = "0.4", optional = true }