[package]
name = "sunlight-chronos"
version = "0.2.1623"






























edition = "2021"
description = "Native SunlightOS window for the Chronos DOS compatibility runtime"
license = "MIT"

[[bin]]
name = "sunlight-chronos"
path = "src/main.rs"

[dependencies]
chronos-core = { path = "../chronos-core" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }
