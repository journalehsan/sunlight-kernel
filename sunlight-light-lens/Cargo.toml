[package]
name = "sunlight-light-lens"
version = "0.2.3436-alpha.1"






























































edition = "2021"

[[bin]]
name = "light-lens"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../ipc" }
# 8 MiB demand-mapped heap: SIMG v2 sample photos decode to ~4 MiB ARGB.
sunlight-libc = { path = "../sunlight-libc", features = ["global-alloc", "dynamic-heap-8m"] }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }

[build-dependencies]
fontdue = "0.7"
