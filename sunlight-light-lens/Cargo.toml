[package]
name = "sunlight-light-lens"
version = "0.2.5275-alpha.2"








































































































































































































edition = "2021"

[[bin]]
name = "light-lens"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../ipc" }
# Bounded decoder scratch, retained original and a fallible 4 MiB viewport cache.
sunlight-libc = { path = "../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m"] }
sun-img = { path = "../sun-img", default-features = false }
sunlight-dialogs = { path = "../sunlight-dialogs" }
libm = "0.2"
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }

[build-dependencies]
fontdue = "0.7"
