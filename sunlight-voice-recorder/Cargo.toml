[package]
name = "sunlight-voice-recorder"
version = "0.2.5736-alpha.2"




































































edition = "2021"
description = "Native streaming PCM voice recorder for SunlightOS"
license = "MIT"

[lib]
name = "sunlight_voice_recorder"

[[bin]]
name = "voice-recorder"
path = "src/main.rs"
test = false
bench = false

[dependencies]
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m", "file-ops"] }
sunlight-audiod = { path = "../services/sunlight-audiod" }
sunlight-media = { path = "../sunlight-media" }
sunlight-dialogs = { path = "../sunlight-dialogs" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }
