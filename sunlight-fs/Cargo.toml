[package]
name = "sunlight-fs"
version = "0.2.9090-alpha.2"


































































































































































































































































































































































































































































































































































































































































































edition = "2021"

[features]
boot-resources = ["dep:lz4_flex"]
helios-git = []
helios-wayland-sunapp-test = []
helios-dynamic-elf-probe = []
helios-dynamic-elf-orphan-fixture = []
helios-dynamic-elf-tls-fixture = []
helios-runtime-mmap = []
helios-runtime-c-startup = []
helios-runtime-c-dso = ["helios-runtime-c-startup"]
helios-dynamic-elf-relocation-fixture = []
helios-dynamic-elf-shared-fixture = []
helios-qalculate-probe = []
helios-qalculate-dso-probe = ["helios-qalculate-probe"]

[dependencies]
lz4_flex = { version = "0.11", default-features = false, optional = true }
sunlight-mm = { path = "../sunlight-mm" }
sunlight-block = { path = "../sunlight-block" }
sunlight-fat = { path = "../sunlight-fat" }

[dev-dependencies]
sunlight-mm = { path = "../sunlight-mm", features = ["testutil"] }
sunlight-fat = { path = "../sunlight-fat", features = ["testutil"] }

[[example]]
name = "pack_boot_resources"
required-features = ["boot-resources"]
