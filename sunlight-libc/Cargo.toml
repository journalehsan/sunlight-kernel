[package]
name = "sunlight-libc"
version = "0.2.2434-alpha.1"



























































































































































































































































































































































































































edition = "2021"

[dependencies]
sunlight-ipc = { path = "../ipc" }

[features]
# Enable #[global_allocator] for `extern crate alloc` (Vec, String, Box, …).
# Only one crate in a binary may declare a global allocator, so this feature
# must not be enabled in libraries — only in top-level binary crates.
default = []
global-alloc = []
dynamic-heap = []
# Select the shell's existing 8 MiB userspace heap budget when using the
# demand-mapped allocator. This is intentionally opt-in so ordinary programs
# retain the smaller dynamic-heap default.
dynamic-heap-8m = ["dynamic-heap"]

[lib]
