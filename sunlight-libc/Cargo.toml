[package]
name = "sunlight-libc"
version = "0.2.9485-alpha.2"



































































































































































































































































































































































































































































































































































































































































































edition = "2021"

[dependencies]
libm = { path = "vendor/libm", default-features = false, optional = true }
sunlight-ipc = { path = "../ipc" }

[features]
helios-wayland-sunapp-test = []
helios-dynamic-elf-probe = []
helios-dynamic-elf-relocation-fixture = ["helios-dynamic-elf-probe"]
helios-dynamic-elf-shared-fixture = ["helios-dynamic-elf-relocation-fixture"]
helios-dynamic-elf-tls-fixture = []
helios-runtime-mmap = []
helios-qalculate-probe = []
# Enable #[global_allocator] for `extern crate alloc` (Vec, String, Box, …).
# Only one crate in a binary may declare a global allocator, so this feature
# must not be enabled in libraries — only in top-level binary crates.
default = []
# Allocating transfer helpers, enabled only by GUI file-management clients.
file-ops = []
global-alloc = []
dynamic-heap = []
# Select the shell's existing 8 MiB userspace heap budget when using the
# demand-mapped allocator. This is intentionally opt-in so ordinary programs
# retain the smaller dynamic-heap default.
dynamic-heap-8m = ["dynamic-heap"]
# Larger budget for desktop wallpaper decode (file + ARGB peak > 8 MiB).
# When both 8m and 16m are enabled, 16m wins in alloc.rs.
dynamic-heap-16m = ["dynamic-heap"]
# Bounded renderer heap, including source snapshots and serialized bitmaps.
dynamic-heap-128m = ["dynamic-heap"]
adaptive-heap = ["dynamic-heap"]
adaptive-document-heap = ["adaptive-heap", "dynamic-heap-128m"]
adaptive-tty-heap = ["adaptive-heap", "dynamic-heap-16m"]
adaptive-tls-heap = ["adaptive-heap", "dynamic-heap-8m"]
# Link the native Rust std platform ABI and startup entry point.
native-std = ["dynamic-heap"]
# C main-return/exit callbacks; keep Rust's raw std exit contract unchanged.
native-c = ["native-std", "dep:libm"]

[lib]
