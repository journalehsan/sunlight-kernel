[package]
name = "wiseowl-memorydb"
version = "0.2.3512-alpha.1"





















edition = "2021"
description = "Wise Owl Phase 2: durable long-term cognitive memory database service"
license = "MIT OR Apache-2.0"

[lib]
name = "wiseowl_memorydb"
path = "src/lib.rs"

[[bin]]
name = "wiseowl-memorydb"
path = "src/bin/wiseowl-memorydb.rs"

[[bin]]
name = "wiseowl-memorydbctl"
path = "src/bin/wiseowl-memorydbctl.rs"

[features]
default = ["host"]
# Host / development: std, filesystem WAL/segments, Unix socket daemon, full tests.
host = [
    "dep:serde",
    "dep:bincode",
    "dep:thiserror",
    "dep:log",
    "dep:lz4_flex",
    "wiseowl-memory/host",
]
# Native SunlightOS daemon + CLI (no_std + alloc + sunlight-ipc).
sunlightos = [
    "dep:sunlight-ipc",
    "dep:sunlight-libc",
    "dep:lz4_flex",
    "dep:heapless",
    "wiseowl-memory/sunlightos",
]
phase375-test = []

[dependencies]
wiseowl-memory = { path = "../wiseowl-memory", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
thiserror = { version = "1", optional = true }
log = { version = "0.4", optional = true }
lz4_flex = { version = "0.11", default-features = false, optional = true }
sunlight-ipc = { path = "../ipc", optional = true }
sunlight-libc = { path = "../sunlight-libc", optional = true, features = ["global-alloc", "dynamic-heap"] }
heapless = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
