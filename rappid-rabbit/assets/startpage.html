<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SunlightOS Start Page</title>
  <style><!-- STARTPAGE_CSS --></style>
</head>
<body>
  <main class="start-page">
    <section class="hero">
      <div class="sun-mark" aria-hidden="true">☀</div>
      <h1>SunlightOS</h1>
      <p class="subtitle">A brighter place to browse</p>
      <p class="browser-name">Rappid Rabbit</p>
    </section>

    <div class="search">
      <label class="visually-hidden" for="search-box">Search or enter address</label>
      <input id="search-box" type="search" placeholder="Search or enter address..." autocomplete="off">
      <button type="button" aria-label="Search">⌕</button>
    </div>

    <section class="links" aria-label="Quick links">
      <a class="link-card" href="https://wiki.archlinux.org/">
        <span class="link-icon">◈</span><span>Arch Wiki</span>
      </a>
      <a class="link-card" href="https://github.com/">
        <span class="link-icon">⌘</span><span>GitHub</span>
      </a>
      <a class="link-card" href="https://sunlightos.org/">
        <span class="link-icon">☀</span><span>SunlightOS Docs</span>
      </a>
      <a class="link-card" href="https://www.rust-lang.org/">
        <span class="link-icon">⚙</span><span>Rust</span>
      </a>
    </section>

    <p class="welcome">Your next destination starts here.</p>
  </main>
  <footer>SunlightOS <span>•</span> Rappid Rabbit</footer>
</body>
</html>
