<!doctype html>
<html>
<head>
    <style>
        body { margin: 20px; background-color: #f5f5f5; color: #222; font-family: sans-serif; }
        form { background-color: white; padding: 16px; border: 1px solid #ccc; }
        input { width: 280px; padding: 8px; border: 1px solid #777; }
        button { padding: 8px 14px; background-color: #f5a623; color: #121212; border: 1px solid #c77f00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Rappid Rabbit Form Lesson</h1>
    <form action="/results" method="get">
        <input type="search" name="q" placeholder="Search the web" maxlength="64">
        <button type="submit">Search</button>
    </form>
    <form action="/lookup?source=rabbit" method="get">
        <input type="text" name="topic" value="SunlightOS">
        <button>Lookup</button>
    </form>
    <input type="text" value="Read only" readonly>
    <input type="text" value="Disabled" disabled>
</body>
</html>
