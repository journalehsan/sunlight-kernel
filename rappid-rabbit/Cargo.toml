[package]
name = "rappid-rabbit"
version = "0.2.3612-alpha.1"



























































































































































































































edition = "2021"

[[bin]]
name = "rappid-rabbit"
path = "src/main.rs"

[lib]
name = "rappid_rabbit"
path = "src/lib.rs"

[dependencies]
sun-font = { path = "../sun-font" }
sunlight-fetch = { path = "../sunlight-fetch", default-features = false, features = ["sunlightos"] }
sunlight-http = { path = "../sunlight-http" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
golden-fish = { path = "../golden-fish", optional = true }
linked_list_allocator = "0.10"
miniz_oxide = "0.8"
# Optional host/bring-up adapter. resvg currently requires `std`; keep it
# explicit until the freestanding target supplies a compatible build.
resvg = { version = "0.45.1", default-features = false, optional = true }

[features]
default = []
svg = ["dep:resvg"]
# "dom" enables Golden Fish HTML parsing and the interactive DOM tree inspector.
# Golden Fish uses `tl` on std-capable targets and a no_std fallback parser on
# SunlightOS freestanding builds, so this feature is supported in both places.
dom = ["dep:golden-fish"]
