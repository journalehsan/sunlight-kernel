[package]
name = "rappid-rabbit"
version = "0.2.7279-alpha.2"















































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "rappid-rabbit"
path = "src/main.rs"

[lib]
name = "rappid_rabbit"
path = "src/lib.rs"

[[example]]
name = "js_dom_smoke"
required-features = ["js-dom-fixture"]

[[example]]
name = "account_snapshots"
required-features = ["js-dom-fixture"]

[[example]]
name = "progressive_presentation"
required-features = ["dom"]

[dependencies]
sunlight-cert = { path = "../sunlight-cert" }
unicode-segmentation = { version = "1.12", default-features = false }
sun-font = { path = "../sun-font" }
sunlight-fetch = { path = "../sunlight-fetch", default-features = false, features = ["sunlightos"] }
sunlight-http = { path = "../sunlight-http" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
golden-fish = { path = "../golden-fish", optional = true }
sunlight-js = { path = "../sunlight-js", optional = true }
tokio = { version = "1.48", default-features = false, features = ["rt", "sync", "time"] }

[features]
default = ["std", "dom", "svg"]
# Rabbit always links std; retained as an explicit platform capability flag.
std = []
svg = ["sunlight-ui/svg"]
# "dom" enables Golden Fish HTML parsing and the interactive DOM tree inspector.
# Native std uses Golden Fish's `tl` parser.
dom = ["dep:golden-fish"]
# Explicit host test harness only; navigation never invokes SunJS.
js-dom-fixture = ["dom", "dep:sunlight-js"]

[target.'cfg(target_os = "sunlightos")'.dependencies]
sunlight-libc = { path = "../sunlight-libc", features = ["native-std", "dynamic-heap-128m"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("sunlightos"))'] }
