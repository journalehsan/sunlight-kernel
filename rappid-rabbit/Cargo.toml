[package]
name = "rappid-rabbit"
version = "0.2.1144"









edition = "2021"

[[bin]]
name = "rappid-rabbit"
path = "src/main.rs"

[lib]
name = "rappid_rabbit"
path = "src/lib.rs"

[dependencies]
sun-font = { path = "../sun-font" }
sunlight-fetch = { path = "../sunlight-fetch", default-features = false, features = ["sunlightos"] }
sunlight-http = { path = "../sunlight-http" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
golden-fish = { path = "../golden-fish", optional = true }

[features]
default = []
# "dom" enables Golden Fish HTML parser + DOM tree inspector.
# Requires a target with std (e.g. host development builds) because
# the current parser backend (tl) depends on std.
dom = ["dep:golden-fish"]
