[bundle]
format = 1

[application]
id = "org.sunlight.chronos.filelab"
name = "Chronos File Lab"
version = "1.0.0"
kind = "terminal-window"
icon = "Resources/icon.tga"

[runtime]
type = "chronos"

[entry]
executable = "C:\\FILELAB.COM"
working_directory = "C:\\"
arguments = []

[chronos]
cpu = "8086"
memory_kb = 640
code_page = 437

[storage]
c_base = ["Program", "Dependencies"]
c_overlay = "persistent"
d_scope = "documents"
t_drive = "temporary"

[permissions]
documents = "read-write"
clipboard = false
printing = false
serial = false
network = false

[window]
default_width = 900
default_height = 650
resizable = true
