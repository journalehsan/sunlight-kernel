[package]
name = "sunlight-native-std-probe"
version = "0.2.5137-alpha.2"
































edition = "2021"
publish = false

[workspace]

[dependencies]
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m"] }
sunlight-hayro-native-probe = { path = "../hayro-native-probe", features = ["raster"] }

[profile.release]
panic = "abort"

[[bin]]
name = "native-fp-probe"
path = "src/fp.rs"
