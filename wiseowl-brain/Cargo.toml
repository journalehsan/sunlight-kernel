[package]
name = "wiseowl-brain"
version = "0.2.4163-alpha.1"
















































edition = "2021"
description = "Wise Owl Phase 4A: native bounded cognitive service"
license = "MIT OR Apache-2.0"

[lib]
name = "wiseowl_brain"
path = "src/lib.rs"

[[bin]]
name = "wiseowl-braind"
path = "src/bin/wiseowl-braind.rs"

[[bin]]
name = "wiseowl-brainctl"
path = "src/bin/wiseowl-brainctl.rs"

[features]
default = ["host"]
host = [
    "dep:serde",
    "dep:bincode",
    "dep:thiserror",
    "dep:log",
]
sunlightos = [
    "dep:sunlight-ipc",
    "dep:sunlight-libc",
    "dep:sunlight-networkd",
    "dep:sunlight-tz",
    "dep:sunlight-locale",
]
phase4a-test = []
executor-v1-test = []
planner-v1-test = []
coordinator-v1-test = []
outcome-observer-v1-test = []
action-receipt-v1-test = []
gui-bridge-foundation-v1-test = []
trusted-session-readiness-v1-test = []
gui-live-action-activation-v1-test = []
delegated-session-lifecycle-ipc-v1-test = []

[dependencies]
heapless = "0.8"
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
thiserror = { version = "1", optional = true }
log = { version = "0.4", optional = true }
sunlight-ipc = { path = "../ipc", optional = true }
sunlight-libc = { path = "../sunlight-libc", optional = true, features = ["global-alloc", "dynamic-heap"] }
sunlight-networkd = { path = "../services/sunlight-networkd", optional = true }
sunlight-tz = { path = "../sunlight-tz", optional = true }
sunlight-locale = { path = "../sunlight-locale", optional = true }
wiseowl-index = { path = "../wiseowl-index", default-features = false }
wiseowl-memorydb = { path = "../wiseowl-memorydb", default-features = false }

[build-dependencies]
wiseowl-index = { path = "../wiseowl-index", default-features = false }

[dev-dependencies]
