[bundle]
format = 1

[application]
id = "org.sunlight.chronos.mines"
name = "Sunlight Mines"
version = "1.0.0"
kind = "windowed"
icon = "Resources/icon.tga"

[runtime]
type = "chronos"

[entry]
executable = "C:\\SUNMINE.EXE"
working_directory = "C:\\"
arguments = []

[chronos]
cpu = "8086"
memory_kb = 640
code_page = 437
video = "auto"
terminal = false

[storage]
c_base = ["Program"]
c_overlay = "persistent"
d_scope = "none"
t_drive = "temporary"

[permissions]
documents = "none"
clipboard = false
printing = false
serial = false
network = false

[window]
default_width = 760
default_height = 560
resizable = true
preserve_aspect_ratio = true
