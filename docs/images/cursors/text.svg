<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- SunlightOS text / I-beam cursor - charcoal vertical bar, white outline,
       sunlit central accent. Hotspot: (16, 15) - centre of the beam. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353C4B"/>
      <stop offset="1" stop-color="#14171E"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <!-- main beam -->
  <path d="M 11 3
           L 21 3
           a 1 1 0 0 1 1 1
           L 22 28
           a 1 1 0 0 1 -1 1
           L 10 29
           a 1 1 0 0 1 -1 -1
           L 9 4
           a 1 1 0 0 1 1 -1 Z"
        fill="url(#body)"/>
  <!-- sunlit mid-band -->
  <rect x="10" y="13" width="12" height="5" rx="1" fill="url(#sun)"/>
  <!-- white outline -->
  <path d="M 11 3
           L 21 3
           a 1 1 0 0 1 1 1
           L 22 28
           a 1 1 0 0 1 -1 1
           L 10 29
           a 1 1 0 0 1 -1 -1
           L 9 4
           a 1 1 0 0 1 1 -1 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
