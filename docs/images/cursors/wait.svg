<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- SunlightOS wait - the "solar spinner": a radiant sun, unique to SunlightOS.
       Hotspot: (16, 16) -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(45 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(90 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(135 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(180 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(225 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(270 16 16)"/>
    <rect x="14.8" y="1.6" width="2.4" height="5.4" rx="1.2" fill="url(#sun)" stroke="#FFFFFF" stroke-width="0.9" transform="rotate(315 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="6.4" fill="url(#sun)" stroke="#FFFFFF" stroke-width="1.3"/>
</svg>
