[package]
name    = "sunshell"
version = "0.2.4955-alpha.2"































































































































































































































































































































































































































































































































































































edition = "2021"

[lib]
name = "sunshell"
path = "src/lib.rs"

[[bin]]
name = "sshl"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc", optional = true, features = ["global-alloc", "dynamic-heap"] }
sunlight-uac = { path = "../services/sunlight-uac", optional = true }
sunlight-telemetry = { path = "../sunlight-telemetry", optional = true }
sunlight-tz = { path = "../sunlight-tz" }
sunlight-locale = { path = "../sunlight-locale" }
libm = "0.2"

[features]
default = ["sunlight"]
std = []
sunlight = ["sunlight-libc", "sunlight-uac"]
# Private deterministic workloads for tools/test.sh shell-phase1.5.
native-tests = ["sunlight", "sunlight-telemetry"]
