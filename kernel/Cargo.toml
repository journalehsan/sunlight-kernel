[package]
name = "sunlight-kernel"
version = "0.2.1574"








































































































































































































































































build = "build.rs"
























































edition = "2021"

[[bin]]
name = "sunlight-kernel"
path = "src/main.rs"

[lib]
name = "sunlight_kernel_mm2a"
path = "src/mm2a_host.rs"

[dependencies]
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
uart_16550 = "0.3"
limine = "0.6"
spin = "0.9"
heapless = "0.8"
linked_list_allocator = "0.10"
sunlight-tui = { path = "../sunlight-tui" }
sunlight-virtio = { path = "../sunlight-virtio" }
sunlight-block = { path = "../sunlight-block" }
sunlight-fat = { path = "../sunlight-fat" }
sunlight-elf = { path = "../sunlight-elf" }
sunlight-fs = { path = "../sunlight-fs" }
sunlight-compat-linux = { path = "../compat-linux" }
sunlight-net = { path = "../sunlight-net" }
lz4_flex = { version = "0.11", default-features = false }

[features]
key_inject = []
launch_trace = []
# Deterministic PMM allocation failures for the focused MM-2A QEMU gate only.
mm2a_test_injection = []
# Focused 12-core remote TLB replacement gate.
mm2b_smp_test = []
# Verbose per-tick / per-alloc diagnostics over the serial port. OFF by default:
# these logs are written while the global scheduler lock is held and block the
# UART, stalling every core. Enable only for debugging.
verbose_diag = []
