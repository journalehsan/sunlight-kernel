[package]
name = "sunlight-vfs-server"
version = "0.2.9778-alpha.2"




































































































































































































































































































































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "sunlight-vfs-server"
path = "src/main.rs"

[dependencies]
spin = "0.9"
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc"] }
sunlight-mm = { path = "../../sunlight-mm" }
sunlight-fs = { path = "../../sunlight-fs" }
sunlight-ipc = { path = "../../ipc" }
sunlight-fat = { path = "../../sunlight-fat" }
heapless = "0.8"

[features]
vfs-d1b-test = []
vfs-d2b-test = ["vfs-d1b-test"]
attachment-transactions = ["sunlight-fs/attachment-transactions"]
boot-resources = ["sunlight-fs/boot-resources"]
# Fault injection only in the dedicated native stat failure gate.
stat-failure-test = ["sunlight-ipc/stat-failure-test"]
# Bounded rendezvous on real authorization requests; absent in normal images.
production-grant-test = []
vfs-n1j-exit-test = []
vfs-n1m-block-test = []
vfs-n1o-fat-test = ["attachment-transactions"]
vfs-c1e1-test = ["vfs-n1o-fat-test"]
vfs-c1e2-test = ["vfs-c1e1-test"]
vfs-c2e-candidate = []
vfs-c1e7-test = ["vfs-c1e2-test"]
vfs-c1e10-test = ["vfs-c1e7-test"]
vfs-c1e11-test = ["vfs-c1e10-test"]
vfs-c1e12-test = ["vfs-c1e11-test", "sunlight-libc/private-file-mmap"]
vfs-c2i1-candidate = ["vfs-c1e12-test"]

[dev-dependencies]
sunlight-fat = { path = "../../sunlight-fat", features = ["testutil"] }
sunlight-mm = { path = "../../sunlight-mm", features = ["testutil"] }
