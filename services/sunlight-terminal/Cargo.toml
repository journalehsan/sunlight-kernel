[package]
name = "sunlight-terminal"
version = "0.2.4106-alpha.1"




















































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "sunlight-terminal"
path = "src/main.rs"

[dependencies]
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m"] }
sunlight-tty = { path = "../../sunlight-tty" }
sunlight-ipc = { path = "../../ipc" }
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }
sun-font = { path = "../../sun-font" }
