[package]
name = "sunlight-solar"
version = "0.2.2232-alpha.1"








































































































































































































































































































































edition = "2021"
description = "Solar HTTP/1.1 server with SBSP (Solar Basic Server Pages) scripting engine for SunlightOS"

[[bin]]
name = "solar"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc" }
sunlight-net = { path = "../../sunlight-net" }
heapless = "0.8"
linked_list_allocator = "0.10"
