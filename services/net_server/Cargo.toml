[package]
name = "sunlight-net-server"
version = "0.2.2661-alpha.1"


















































































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "net_server"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-net = { path = "../../sunlight-net" }
linked_list_allocator = "0.10"
x86_64 = "0.15"
smoltcp = {
    version = "0.11",
    default-features = false,
    features = [
        "medium-ethernet",
        "proto-ipv4",
        "socket-udp",
        "socket-tcp",
    ]
}
