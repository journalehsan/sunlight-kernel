[package]
name = "sunlight-control-panel"
version = "0.2.2680-alpha.1"









































































































































































































































































































edition = "2021"
build = "build.rs"

[[bin]]
name = "control-panel"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
# Replaces the former private 8 MiB bump allocator with libc's reclaiming
# mmap-backed heap.  The feature is owned only by this native binary.
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "dynamic-heap-8m"] }
sunlight-networkd = { path = "../sunlight-networkd" }
sunlight-tz = { path = "../../sunlight-tz" }
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }
sunlight-wallpaper = { path = "../../sunlight-wallpaper" }
sun-font = { path = "../../sun-font" }

[build-dependencies]
fontdue = "0.7"
image = { version = "0.25.9", default-features = false, features = ["png"] }
