[package]
name = "sunlight-tty-server"
version = "0.2.3904-alpha.1"









































































































































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "sunlight-tty-server"
path = "src/main.rs"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-fs  = { path = "../../sunlight-fs" }
sunlight-tty = { path = "../../sunlight-tty" }
sunlight-tui = { path = "../../sunlight-tui" }
# 16 MiB: login SIMG decode needs ~width*height*4 (~6 MiB) and stays resident
# for re-login redraws. Static 256 KiB heap always OOM'd → solid-color login.
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m"] }
sunlight-telemetry = { path = "../../sunlight-telemetry" }
# Login background is SIMG v2 (sub+lz4); decode once at startup.
sun-img = { path = "../../sun-img", default-features = false }
