[package]
name = "sunlight-uac"
version = "0.2.5765-alpha.2"































































































































































































































































































































































































































































































































































































































edition = "2021"

# Shared no_std logic (sessions + capability rules) consumed by both binaries.
[lib]
name = "sunlight_uac"
path = "src/lib.rs"

[dependencies]
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }
sun-font = { path = "../../sun-font" }
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc" }
heapless = "0.8"
sunlight-fs = { path = "../../sunlight-fs" }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5.0", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
linked_list_allocator = "0.10"

# The privileged daemon: spawned by sunlightd, registers as "uac".
[[bin]]
name = "uac_service"
path = "src/bin/uac_service.rs"

# The control client: lives in RamFs at /bin/capabilityctl.
[[bin]]
name = "capabilityctl"
path = "src/bin/capabilityctl.rs"

# The privilege-delegation tool: lives in RamFs at /bin/runas.
[[bin]]
name = "runas"
path = "src/bin/runas.rs"

[features]
production-grant-test = []
production-history-test = ["production-grant-test"]
session-race-test = []
session-h4-test = ["session-race-test"]
# Native N6 resource-reap trigger, using ordinary shared memory and manager IPC.
session-reap-test = ["session-h4-test"]
# Authenticated owner-ordered reply/close and real deferred-reply exec probes.
session-reply-test = ["session-reap-test"]

[[bin]]
name = "session-race-probe"
path = "src/bin/session_race_probe.rs"
required-features = ["session-race-test"]

[[bin]]
name = "grant-probe"
path = "src/bin/grant_probe.rs"
required-features = ["production-grant-test"]
