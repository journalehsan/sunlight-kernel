[package]
name = "sunlight-init"
version = "0.2.9485-alpha.2"



































































































































































































































































































































































































































































































































































































































































































edition = "2021"

[[bin]]
name = "sunlight-init"
path = "src/main.rs"

[[bin]]
name = "vfs-stat-caller"
path = "src/stat_caller.rs"
required-features = ["stat-failure-test"]

[dependencies]
sunlight-libc = { path = "../../sunlight-libc" }
sunlight-ipc = { path = "../../ipc" }

[features]
zram-lifecycle-test = []
zram-fault-test = ["zram-lifecycle-test"]
zram-pressure-test = ["zram-lifecycle-test"]
recovery-test = []
vfs-l1c-1-test = []
vfs-l1c-2-test = ["vfs-l1c-1-test"]
vfs-d1b-test = ["vfs-l1c-2-test"]
vfs-d2a-test = ["vfs-d1b-test"]
vfs-l1c-r4-test = ["vfs-l1c-2-test"]
vfs-l1c-r1-test = ["vfs-l1c-r4-test"]
vfs-l1c-r1b-test = ["vfs-l1c-r1-test"]
vfs-l1c-r2-test = ["vfs-l1c-r1-test"]
vfs-l1c-r3-test = ["vfs-l1c-r1-test"]
vfs-l1c-r5-test = ["vfs-l1c-r4-test"]
vfs-l1c-adapter-accounting-test = ["vfs-l1c-r5-test"]
vfs-l1c-parent-lifecycle-test = ["vfs-l1c-adapter-accounting-test"]
vfs-l1c-file-ipc-test = ["vfs-l1c-parent-lifecycle-test"]

# Fault injection only in the dedicated native stat failure gate.
stat-failure-test = ["sunlight-ipc/stat-failure-test"]
