[package]
name = "sunlight-dialogd"
version = "0.2.5587-alpha.2"







































































































































































































































































































































































































edition = "2021"

[dependencies]
heapless = "0.8"
sun-font = { path = "../../sun-font" }
sunlight-dialogs = { path = "../../sunlight-dialogs" }
sunlight-audiod = { path = "../sunlight-audiod" }
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "dynamic-heap-16m"] }
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }

[[bin]]
name = "sunlight-dialogd"
path = "src/main.rs"
required-features = ["native-svg"]

[[bin]]
name = "sunlight-dialog"
path = "src/bin/sunlight-dialog.rs"

[features]
native-svg = ["sunlight-ui/svg", "sunlight-libc/native-std"]
