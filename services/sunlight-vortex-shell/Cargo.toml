[package]
name = "sunlight-vortex-shell"
version = "0.2.5137-alpha.2"





















































































































































































































































































































































































































































































edition = "2021"

[features]
# native-std alone defaults to a 1 MiB dynamic heap; pin 16 MiB here so SVG
# icon caches and SIMG wallpaper decode stay under one budget even when
# `--no-default-features` is used. Screen-sized wallpaper pixels use mmap on
# `target_os = "sunlightos"` (see wallpaper_buffer.rs), not this heap.
native-svg = [
    "sunlight-ui/svg",
    "sunlight-libc/native-std",
    "sunlight-libc/dynamic-heap-16m",
    "dynamic-heap",
]
default = ["dynamic-heap"]
# 16 MiB: SIMG wallpapers need ~file+decoded ARGB peak (~10 MiB). 8 MiB OOM'd
# the decode and left the solid gray FALLBACK_BG desktop.
dynamic-heap = ["sunlight-libc/dynamic-heap-16m"]
# Opt-in accelerated allocation churn used by QEMU soak verification. Normal
# desktop builds do not execute this path.
stress = []

[build-dependencies]
fontdue = "0.7"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc", "file-ops"] }
sunlight-networkd = { path = "../sunlight-networkd" }
sunlight-audiod = { path = "../sunlight-audiod" }
sunlight-audio = { path = "../../sunlight-audio" }
sunlight-telemetry = { path = "../../sunlight-telemetry" }
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }
sun-font = { path = "../../sun-font" }
sunlight-wallpaper = { path = "../../sunlight-wallpaper" }
sunlight-locale = { path = "../../sunlight-locale" }
sunlight-tz = { path = "../../sunlight-tz" }
sunlight-calendar = { path = "../../sunlight-calendar" }
sunlight-reminders = { path = "../../sunlight-reminders" }
sunlight-shell-appstate = { path = "../../sunlight-shell-appstate" }
sunlight-uac = { path = "../sunlight-uac" }
# Shared Sun Shell calculator (`= expr`) — same engine as the terminal `=` builtin.
sunshell = { path = "../../sunshell", default-features = false, features = ["sunlight"] }

[[bin]]
name = "sunlight-vortex-shell"
path = "src/main.rs"
required-features = ["native-svg"]
