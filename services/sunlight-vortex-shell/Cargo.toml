[package]
name = "sunlight-vortex-shell"
version = "0.2.2353-alpha.1"



























































































































































































































































































edition = "2021"

[features]
# Native SunlightOS desktop builds retain the established 8 MiB mmap-backed
# heap.  Keeping this as a shell feature also lets the focused integration
# proof compile the same shell against libc's static heap with
# `--no-default-features --features stress`.
default = ["dynamic-heap"]
dynamic-heap = ["sunlight-libc/dynamic-heap-8m"]
# Opt-in accelerated allocation churn used by QEMU soak verification. Normal
# desktop builds do not execute this path.
stress = []

[build-dependencies]
fontdue = "0.7"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc", features = ["global-alloc"] }
sunlight-telemetry = { path = "../../sunlight-telemetry" }
sunlight-ui = { path = "../../sunlight-ui", features = ["app"] }
sun-font = { path = "../../sun-font" }
sunlight-wallpaper = { path = "../../sunlight-wallpaper" }
sunlight-locale = { path = "../../sunlight-locale" }
sunlight-tz = { path = "../../sunlight-tz" }
sunlight-calendar = { path = "../../sunlight-calendar" }
sunlight-reminders = { path = "../../sunlight-reminders" }
sunlight-shell-appstate = { path = "../../sunlight-shell-appstate" }
# Shared Sun Shell calculator (`= expr`) — same engine as the terminal `=` builtin.
sunshell = { path = "../../sunshell", default-features = false, features = ["sunlight"] }

[[bin]]
name = "sunlight-vortex-shell"
path = "src/main.rs"
