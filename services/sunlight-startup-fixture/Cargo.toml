[package]
name = "sunlight-startup-fixture"
version = "0.2.5217-alpha.2"


















































































































































edition = "2021"
publish = false

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-libc = { path = "../../sunlight-libc" }

[[bin]]
name = "su1"
path = "src/su1.rs"

[[bin]]
name = "su2"
path = "src/su2.rs"

[features]
demand-test = []
idle-test = ["demand-test"]
dependency-test = ["idle-test"]

[[bin]]
name = "d1-fixture"
path = "src/d1_fixture.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-timeout"
path = "src/d1_timeout.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-crash"
path = "src/d1_crash.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-dependent"
path = "src/d1_dependent.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-driver"
path = "src/d1_driver.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-denied"
path = "src/d1_denied.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d1-activate-only"
path = "src/d1_activation_only.rs"
required-features = ["demand-test"]
test = false

[[bin]]
name = "d2-fixture"
path = "src/d2_fixture.rs"
required-features = ["idle-test"]
test = false

[[bin]]
name = "d2-driver"
path = "src/d2_driver.rs"
required-features = ["idle-test"]
test = false

[[bin]]
name = "d2-dependent"
path = "src/d2_dependent.rs"
required-features = ["idle-test"]
test = false

[[bin]]
name = "d3-parent"
path = "src/d2_fixture.rs"
required-features = ["dependency-test"]
test = false

[[bin]]
name = "d3-leaf"
path = "src/d2_fixture.rs"
required-features = ["dependency-test"]
test = false

[[bin]]
name = "d3-client"
path = "src/d3_client.rs"
required-features = ["dependency-test"]
test = false
