[package]
name = "sunlightd"
version = "0.2.5047-alpha.2"









































































































































































































































































































































































































































































































































































































edition = "2021"

[dependencies]
sunlight-ipc = { path = "../../ipc" }
sunlight-fs = { path = "../../sunlight-fs" }
sunlight-libc = { path = "../../sunlight-libc" }
heapless = "0.8"

[features]
# Only start docserv when its optional executable is included in the image.
default = []
document-service = []
document-service-gate = ["document-service"]
document-ui-gate = ["document-service"]
identity-phase-c-test = []

[lib]
name = "sunlightd"
path = "src/lib.rs"
test = true

[[bin]]
name = "sunlightd"
path = "src/main.rs"
test = false
