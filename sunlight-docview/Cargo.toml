[package]
name = "sunlight-docview"
version = "0.2.5241-alpha.2"













































edition = "2021"

[dependencies]
anyhow = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sunlight-docserv = { path = "../sunlight-docserv", default-features = false }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
sun-font = { path = "../sun-font" }
sunlight-ipc = { path = "../ipc" }
sunlight-dialogs = { path = "../sunlight-dialogs" }

[features]
default = ["std"]
std = ["anyhow/std", "serde/std", "sunlight-docserv/std"]
native-ui-smoke = ["std"]
native-std = ["std", "dep:sunlight-libc"]

[target.'cfg(target_os = "sunlightos")'.dependencies]
sunlight-libc = { path = "../sunlight-libc", optional = true, features = ["native-std", "dynamic-heap-128m"] }

[[bin]]
name = "sunlight-docview"
path = "src/main.rs"
required-features = ["std"]

[dev-dependencies]
sunlight-docserv = { path = "../sunlight-docserv", features = ["hayro-host"] }
