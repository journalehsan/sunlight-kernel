[package]
name = "sunlight-silicon-echoes"
version = "0.2.4547-alpha.2"





















































































































































































edition = "2021"
description = "Silicon Echoes: 1993, a native SunlightOS narrative game vertical slice"

[lib]
name = "sunlight_silicon_echoes"
path = "src/lib.rs"

[[bin]]
name = "silicon-echoes"
path = "src/main.rs"

[dependencies]
sun-font = { path = "../sun-font" }
sunlight-audio = { path = "../sunlight-audio" }
sunlight-audiod = { path = "../services/sunlight-audiod" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc", features = ["global-alloc", "dynamic-heap-8m"] }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
