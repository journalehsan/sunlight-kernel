[package]
name = "sun-img"
version = "0.2.4384-alpha.2"




































































































































edition = "2021"
description = "Minimal user-space color image conversion foundation for SunlightOS"
license = "MIT"

[lib]
name = "sun_img"
path = "src/lib.rs"

[features]
default = ["std"]
std = []

[dependencies]
lz4_flex = { version = "0.11", default-features = false }
zune-core = { version = "0.4.12", default-features = false }
zune-jpeg = { version = "0.4.20", default-features = false }
zune-png = { version = "0.4.10", default-features = false }
