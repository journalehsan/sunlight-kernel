[package]
name = "sunlight-devices"
version = "0.2.1913"

































edition = "2021"

[lib]
name = "sunlight_devices"
path = "src/lib.rs"

[[bin]]
name = "sunlight-devices"
path = "src/main.rs"

[dependencies]
sun-font = { path = "../sun-font" }
sunlight-deviced = { path = "../services/sunlight-deviced" }
sunlight-ipc = { path = "../ipc" }
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ui = { path = "../sunlight-ui", features = ["app"] }
linked_list_allocator = "0.10"

[build-dependencies]
fontdue = "0.7"
