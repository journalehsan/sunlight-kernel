[package]
name = "sunlight-utils"
version = "0.2.2725-alpha.1"





edition = "2021"

[lib]
name = "sunlight_utils"
path = "src/lib.rs"




















































































































































































































































































































































































































































[[bin]]
name = "sunlight-utils"
path = "src/main.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "pwd"
path = "src/bin/pwd.rs"

[[bin]]
name = "true"
path = "src/bin/true.rs"

[[bin]]
name = "false"
path = "src/bin/false.rs"

[[bin]]
name = "basename"
path = "src/bin/basename.rs"

[[bin]]
name = "dirname"
path = "src/bin/dirname.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "cmp"
path = "src/bin/cmp.rs"

[[bin]]
name = "cksum"
path = "src/bin/cksum.rs"

[dependencies]
sunlight-libc = { path = "../sunlight-libc" }
sunlight-ipc = { path = "../ipc" }
memchr = { version = "2", default-features = false }
